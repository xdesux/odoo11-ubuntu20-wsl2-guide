[options]
; Hardened legacy deployment. Complete PRODUCTION.md before starting.
; Replace this value locally; never commit a real secret.
admin_passwd = CHANGE_MASTER_PASSWORD

; Local PostgreSQL Unix socket with peer authentication.
; Linux user, PostgreSQL role, and database are all myodoo11.
db_host = /var/run/postgresql
db_port = 5432
db_user = myodoo11
db_password = False
db_name = myodoo11
dbfilter = ^myodoo11$
list_db = False
db_maxconn = 16

; Only a trusted reverse proxy on the same Linux host may reach these ports.
http_interface = 127.0.0.1
http_port = 5511
longpolling_port = 5512
proxy_mode = True

; Keep persistent state separate from read-only application code.
data_dir = /var/lib/myodoo11
addons_path = /opt/myodoo11/myodoo11/addons,/opt/myodoo11/myodoo11/custom_apps
without_demo = all
test_enable = False

; Starting values for a small installation; load-test before go-live.
workers = 2
max_cron_threads = 1
limit_memory_soft = 536870912
limit_memory_hard = 805306368
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = 300

; Log to stderr, captured by systemd journal. Configure journal retention.
logfile = False
log_db = False
log_level = info
log_handler = :INFO
